name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --run

      - name: Build project
        run: npm run build

      - name: Archive site build
        run: |
          cd dist
          zip -r ../site-dist.zip .

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: site-dist.zip
          generate_release_notes: true
